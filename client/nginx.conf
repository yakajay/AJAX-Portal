server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API is reached on the same address as the app, so every company subdomain talks to its own
  # workspace: the Host header is passed through untouched (it selects the company).
  location /api/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths (e.g. /leave on refresh) fall back to index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
