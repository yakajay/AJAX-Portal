name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it manually from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # tags the released version
  id-token: write

env:
  PROJECT_ID: project-08bcc63c-a190-4069-bb9
  REGION: asia-south1
  SERVICE: ajax-server
  WIF_PROVIDER: projects/387264343209/locations/global/workloadIdentityPools/github/providers/ajax-portal
  DEPLOY_SA: github-deployer@project-08bcc63c-a190-4069-bb9.iam.gserviceaccount.com

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/**'
            client:
              - 'client/**'
              - '.github/workflows/**'

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - if: matrix.app == 'client'
        run: npm run build

  deploy-server:
    needs: [changes, test]
    if: needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy backend to Cloud Run
        # Existing env vars (MongoDB, secrets) are kept on the service automatically
        run: |
          VERSION=$(node -p "require('./server/package.json').version")
          gcloud run deploy "$SERVICE" \
            --source server \
            --update-env-vars "GIT_SHA=${GITHUB_SHA}" \
            --update-labels "app-version=${VERSION//./-},git-sha=${GITHUB_SHA::12}" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --port 5000 \
            --allow-unauthenticated \
            --quiet
      - name: Health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          curl -fsS "$URL/api/health"
      - name: Tag the released version
        run: |
          VERSION=$(node -p "require('./server/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already tagged; this deploy is a rebuild of that version (commit ${GITHUB_SHA::7})."
          else
            git tag "v${VERSION}" "$GITHUB_SHA"
            git push origin "v${VERSION}"
          fi

  deploy-client:
    needs: [changes, test, deploy-server]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.changes.outputs.client == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - run: npm ci
      - run: npm run build
        env:
          # Repository variables (Settings > Secrets and variables > Actions > Variables); blank = no redirect
          VITE_APP_URL: ${{ vars.APP_URL }}
          VITE_PLATFORM_URL: ${{ vars.PLATFORM_URL }}
      - name: Deploy frontend to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$PROJECT_ID" --non-interactive
