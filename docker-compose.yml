# Runs the API and the web app. The database is MongoDB Atlas (or any MongoDB you point
# MONGODB_URI at) by default; see docker-compose.localdb.yml for a bundled local MongoDB.
#
#   cp server/.env.example server/.env     # fill in MONGODB_URI and JWT_SECRET
#   docker compose up --build
#
# Web: http://localhost:5173    API: http://localhost:5000/api

services:
  api:
    build: ./server
    env_file: ./server/.env
    environment:
      # development: OTP codes print to `docker compose logs api` and JWT_SECRET may be omitted.
      # Set NODE_ENV=production for real deployments (needs JWT_SECRET and SMTP_*).
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      # Must match the address the browser loads the web app from (CORS)
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
    ports:
      - "5000:5000"
    restart: unless-stopped

  web:
    build:
      context: ./client
      args:
        # Baked into the bundle at build time: the URL the browser uses for the API
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
